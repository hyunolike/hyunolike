name: Update Recent Posts

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'scripts/generate-recent-posts.mjs'

permissions:
  contents: write

concurrency:
  group: recent-posts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate SVG
        run: node scripts/generate-recent-posts.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add recent-posts.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: update recent posts svg"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin master && git push origin HEAD:master; then
                echo "Pushed on attempt ${attempt}."
                break
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "Push failed after ${attempt} attempts." >&2
                exit 1
              fi
              echo "Push rejected, retrying (${attempt})..."
              sleep $((attempt * 2))
            done
          fi
