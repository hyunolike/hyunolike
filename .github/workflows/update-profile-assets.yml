name: Update profile assets

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-repo-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Checkout private traffic history
        uses: actions/checkout@v6
        with:
          repository: hyunolike/profile-private-data
          token: ${{ secrets.PROFILE_TRAFFIC_TOKEN }}
          path: private-profile-data

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Generate repository traffic card
        env:
          GITHUB_OWNER: hyunolike
          MAX_REPOSITORIES: '30'
          EXTRA_REPOSITORIES: ${{ secrets.EXTRA_REPOSITORIES }}
          EXTRA_REPOSITORY_LABELS: ${{ secrets.EXTRA_REPOSITORY_LABELS }}
          TRAFFIC_API_TOKEN: ${{ secrets.PROFILE_TRAFFIC_TOKEN }}
        run: |
          node scripts/generate-repo-traffic.mjs \
            --collect \
            --history private-profile-data/traffic-history.json \
            --out repo-traffic.svg

      - name: Generate visitor trend card
        run: |
          node scripts/generate-visitor-trend.mjs \
            --history private-profile-data/traffic-history.json \
            --out visitor-trend.svg

      - name: Commit public profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo-traffic.svg visitor-trend.svg
          if git diff --cached --quiet; then
            echo "No public profile asset changes."
          else
            git commit -m "chore: update repository traffic card"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin master && git push origin HEAD:master; then
                echo "Pushed on attempt ${attempt}."
                break
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "Push failed after ${attempt} attempts." >&2
                exit 1
              fi
              echo "Push rejected, retrying (${attempt})..."
              sleep $((attempt * 2))
            done
          fi

      - name: Commit private traffic history
        working-directory: private-profile-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic-history.json
          if git diff --cached --quiet; then
            echo "No private traffic history changes."
          else
            git commit -m "chore: update traffic history"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase && git push; then
                echo "Pushed on attempt ${attempt}."
                break
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "Push failed after ${attempt} attempts." >&2
                exit 1
              fi
              echo "Push rejected, retrying (${attempt})..."
              sleep $((attempt * 2))
            done
          fi
