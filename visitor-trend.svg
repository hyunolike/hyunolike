<svg xmlns="http://www.w3.org/2000/svg" width="780" height="260" viewBox="0 0 780 260" role="img" aria-labelledby="title desc">
  <title id="title">Visitor Trend</title>
  <desc id="desc">Daily GitHub repository traffic trend for hyunolike.</desc>
  <style>
    .card { fill: #0d1117; stroke: #30363d; }
    .heading { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #e6edf3; }
    .subtle { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #8b949e; }
    .axis-label { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #8b949e; }
    .peak-label { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #e6edf3; }
    .legend-label { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #c9d1d9; }
    .empty { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #8b949e; }
    .axis { fill: none; stroke: #8b949e; stroke-width: 1.6; stroke-linecap: round; }
    .grid { fill: none; stroke: #30363d; stroke-width: 1.2; stroke-linecap: round; }
    .line-views { fill: none; stroke: #4dabf7; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .line-uniques { fill: none; stroke: #69db7c; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .dot-views { fill: #4dabf7; }
    .dot-uniques { fill: #69db7c; }
    @media (prefers-color-scheme: light) {
      .card { fill: #ffffff; stroke: #d0d7de; }
      .heading, .peak-label { fill: #1f2328; }
      .subtle, .axis-label { fill: #57606a; }
      .legend-label { fill: #24292f; }
      .empty { fill: #57606a; }
      .axis { stroke: #1e1e1e; }
      .grid { stroke: #d0d7de; }
      .line-views { stroke: #1971c2; }
      .line-uniques { stroke: #2f9e44; }
      .dot-views { fill: #1971c2; }
      .dot-uniques { fill: #2f9e44; }
    }
  </style>
