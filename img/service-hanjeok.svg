<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="390" height="224" viewBox="0 0 390 224" role="img" aria-labelledby="title desc">
  <title id="title">한적 Hanjeok</title>
  <desc id="desc">Hanjeok (hanjeok.com): travel course recommendation that avoids overcrowded tourist spots. Kotlin, Spring Boot 4, Next.js 16, PostGIS, GCP.</desc>
  <style>
    .card { fill: #0d1117; stroke: #30363d; }
    .name { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #e6edf3; }
    .url { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #58a6ff; }
    .subtle { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #8b949e; }
    .live { fill: #0f2a1a; stroke: #238636; }
    .live-dot { fill: #3fb950; }
    .live-text { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #3fb950; }
    .divider { stroke: #30363d; }
    .desc { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #e6edf3; }
    .marker { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #58a6ff; }
    .bullet { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #c9d1d9; }
    .chip { fill: #161b22; stroke: #30363d; }
    .chip-text { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #c9d1d9; }
    @media (prefers-color-scheme: light) {
      .card { fill: #ffffff; stroke: #d0d7de; }
      .name { fill: #1f2328; }
      .url { fill: #0969da; }
      .subtle { fill: #57606a; }
      .live { fill: #dafbe1; stroke: #1a7f37; }
      .live-dot { fill: #1a7f37; }
      .live-text { fill: #1a7f37; }
      .divider { stroke: #d0d7de; }
      .desc { fill: #1f2328; }
      .marker { fill: #0969da; }
      .bullet { fill: #1f2328; }
      .chip { fill: #f6f8fa; stroke: #d0d7de; }
      .chip-text { fill: #1f2328; }
    }
  </style>
  <defs><clipPath id="hanjeok-logo"><rect x="24" y="20" width="44" height="44" rx="10"/></clipPath></defs>
  <rect class="card" x="0.5" y="0.5" width="389" height="223" rx="12"/>
  <image x="24" y="20" width="44" height="44" clip-path="url(#hanjeok-logo)" href="data:image/png;base64," xlink:href="data:image/png;base64,"/>
  <text class="name" x="80" y="38">한적 Hanjeok</text>
  <text x="80" y="58"><tspan class="url">hanjeok.com</tspan><tspan class="subtle" dx="4">· Solo, full-stack</tspan></text>
  <rect class="live" x="314" y="24" width="52" height="20" rx="10"/>
  <circle class="live-dot" cx="327" cy="34" r="3.5"/>
  <text class="live-text" x="335" y="38">Live</text>
  <line class="divider" x1="24" y1="78" x2="366" y2="78"/>
  <text class="desc" x="24" y="102">Diagnoses crowded tourist spots and builds</text>
  <text class="desc" x="24" y="121">detour courses to quieter places and days.</text>
  <text class="marker" x="24" y="152">▸</text>
  <text class="bullet" x="38" y="152">Passed prelim round, 2026 Tourism Data Contest</text>
  <text class="marker" x="24" y="172">▸</text>
  <text class="bullet" x="38" y="172">11 Modulith modules, 11 batch jobs, blue-green</text>
  <rect class="chip" x="24" y="186" width="53" height="20" rx="10"/>
  <text class="chip-text" x="50.5" y="200" text-anchor="middle">Kotlin</text>
  <rect class="chip" x="83" y="186" width="95" height="20" rx="10"/>
  <text class="chip-text" x="130.5" y="200" text-anchor="middle">Spring Boot 4</text>
  <rect class="chip" x="184" y="186" width="77" height="20" rx="10"/>
  <text class="chip-text" x="222.5" y="200" text-anchor="middle">Next.js 16</text>
  <rect class="chip" x="267" y="186" width="59" height="20" rx="10"/>
  <text class="chip-text" x="296.5" y="200" text-anchor="middle">PostGIS</text>
  <rect class="chip" x="332" y="186" width="34" height="20" rx="10"/>
  <text class="chip-text" x="349" y="200" text-anchor="middle">GCP</text>
</svg>
