<svg xmlns="http://www.w3.org/2000/svg" width="780" height="240" viewBox="0 0 780 240">
  <style>
    .card { fill: #0d1117; stroke: #30363d; }
    .heading { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #e6edf3; }
    .divider { stroke: #30363d; }
    .marker { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #58a6ff; }
    .title { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #e6edf3; }
    .date { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #8b949e; }
    .new-badge { fill: #238636; }
    .new-text { font: 700 9px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #ffffff; letter-spacing: 0.3px; }
    @media (prefers-color-scheme: light) {
      .card { fill: #ffffff; stroke: #d0d7de; }
      .heading { fill: #1f2328; }
      .divider { stroke: #d0d7de; }
      .marker { fill: #0969da; }
      .title { fill: #1f2328; }
      .date { fill: #57606a; }
      .new-badge { fill: #1a7f37; }
    }
  </style>
  <rect class="card" x="0.5" y="0.5" width="779" height="239" rx="12"/>
  <svg x="24" y="13" width="18" height="18" viewBox="0 0 50 50">
    <path d="M50 25c0 13.807-11.193 25-25 25S0 38.807 0 25 11.193 0 25 0s25 11.193 25 25" fill="#FF5A4A"/>
    <g fill="#FFF">
      <path d="M25.544 14.674a2.717 2.717 0 1 0 0 5.435 2.717 2.717 0 0 0 0-5.435M16.848 14.674a2.717 2.717 0 1 0 0 5.435 2.717 2.717 0 0 0 0-5.435M34.24 14.674a2.718 2.718 0 1 0 0 5.435 2.718 2.718 0 0 0 0-5.435M25.544 23.37a2.718 2.718 0 1 0 0 5.435 2.718 2.718 0 0 0 0-5.435M25.544 32.065a2.718 2.718 0 1 0 0 5.436 2.718 2.718 0 0 0 0-5.436"/>
    </g>
  </svg>
  <text class="heading" x="50" y="30">최근 블로그 글</text>
  <line class="divider" x1="24" y1="42" x2="756" y2="42"/>
    <text class="marker" x="24" y="73">▶</text>
    <text class="title" x="44" y="73">[프로젝트] GCP 단일 VM에 블루그린 배포를 올렸다 &amp;mdash; 무중단은 성공했지만 재부…</text>
    <text class="date" x="756" y="73" text-anchor="end">2026.08.24</text>
    <text class="marker" x="24" y="107">▶</text>
    <text class="title" x="44" y="107">[운영] 코드만 옮기면 끝일까? SVN 커밋 이력을 보존하며 GitLab로 마이그레이션한 과…</text>
    <text class="date" x="756" y="107" text-anchor="end">2026.08.19</text>
    <text class="marker" x="24" y="141">▶</text>
    <text class="title" x="44" y="141">[운영] 서로 다른 Linux&amp;middot;Windows 로그를 하나의 운영 원칙으로: AWS S3 로그 …</text>
    <text class="date" x="756" y="141" text-anchor="end">2026.08.14</text>
    <text class="marker" x="24" y="175">▶</text>
    <text class="title" x="44" y="175">[운영] AL2023에서 Cron 대신 systemd Timer를 선택한 이유와 AWS S3 파일 전송 운영…</text>
    <text class="date" x="756" y="175" text-anchor="end">2026.08.03</text>
    <text class="marker" x="24" y="209">▶</text>
    <text class="title" x="44" y="209">[프로젝트] 새 계측 없이 완성한 Slack 운영 알림 &amp;mdash; 외부 API Quota&amp;middot;일…</text>
    <text class="date" x="756" y="209" text-anchor="end">2026.07.27</text>
</svg>
